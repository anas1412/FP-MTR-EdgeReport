<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FP-MTR EdgeReport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110F;
    --panel: #1C1815;
    --panel-2: #221D19;
    --border: #332C24;
    --gold: #C9962C;
    --gold-soft: #E3B95A;
    --text: #EDE6D6;
    --muted: #948B7C;
    --red: #D9534F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,150,44,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,150,44,0.06), transparent 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  /* ── login view ─────────────────────────────────────────────────────────── */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 40px 36px 36px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 11px;
    color: var(--gold-soft);
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .lead {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 11px 13px;
    outline: none;
    border-radius: 0;
  }
  .field input:focus { border-color: var(--gold); }
  .pass-row { position: relative; }
  .pass-row input { padding-right: 66px; }
  .pass-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 6px 8px;
  }
  .pass-toggle:hover { color: var(--gold-soft); }
  .error {
    display: none;
    background: rgba(217,83,79,0.10);
    border: 1px solid rgba(217,83,79,0.35);
    color: #E88C88;
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .error.show { display: block; }
  button.login {
    width: 100%;
    background: var(--gold);
    border: none;
    color: #14110F;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    padding: 13px;
    cursor: pointer;
    margin-top: 6px;
    letter-spacing: 0.02em;
  }
  button.login:hover { background: var(--gold-soft); }
  button.login:disabled { opacity: 0.55; cursor: default; }
  .note {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }

  /* ── report view ────────────────────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--gold-soft);
    white-space: nowrap;
  }
  .topbar .spacer { flex: 1; }
  .who {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
  }
  button.logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.logout:hover { color: var(--text); border-color: var(--gold); }
  .acct-filter {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .acct-filter label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    white-space: nowrap;
  }
  select.acct {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    border-radius: 0;
    max-width: 250px;
    cursor: pointer;
  }
  select.acct:focus { border-color: var(--gold); }
  select.acct option { background: var(--panel-2); color: var(--text); }
  .status {
    padding: 18px 28px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  .status a { color: var(--gold-soft); }
  #reportFrame {
    width: 100%;
    height: calc(100vh - 57px);
    border: none;
    display: block;
  }
  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; padding: 14px 18px; }
    .who { max-width: 150px; }
    .login-card { padding: 32px 24px 28px; }
  }
</style>
</head>
<body>

<!-- ── login ─────────────────────────────────────────────────────────────── -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <div class="eyebrow">FP-MTR · FundingPips</div>
    <h1>Edge Report</h1>
    <p class="lead">Sign in with your FundingPips MatchTrader account to build your trading edge report.</p>
    <div id="errorBox" class="error"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pass-row">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" id="passToggle" class="pass-toggle">Show</button>
        </div>
      </div>
      <button type="submit" id="loginBtn" class="login">Log in</button>
    </form>
    <div class="note">Your session is saved on this machine — no repeated logins.</div>
  </div>
</div>

<!-- ── report ────────────────────────────────────────────────────────────── -->
<div id="reportView" class="hidden">
  <div class="topbar">
    <span class="brand">FP-MTR EDGEREPORT</span>
    <div class="spacer"></div>
    <div class="acct-filter">
      <label for="acctFilter">Account</label>
      <select id="acctFilter" class="acct"></select>
    </div>
    <span class="who" id="whoAmI"></span>
    <button type="button" id="logoutBtn" class="logout">Log out</button>
  </div>
  <div class="status" id="statusLine">Loading…</div>
  <iframe id="reportFrame" title="Trading Edge Report"></iframe>
</div>

<script>
const $ = (id) => document.getElementById(id)

const loginView = $("loginView")
const reportView = $("reportView")
const statusLine = $("statusLine")
const frame = $("reportFrame")
const errorBox = $("errorBox")

function showError(msg) {
  errorBox.textContent = msg
  errorBox.classList.add("show")
}

// ── password visibility ────────────────────────────────────────────────────
$("passToggle").addEventListener("click", () => {
  const p = $("password")
  const show = p.type === "password"
  p.type = show ? "text" : "password"
  $("passToggle").textContent = show ? "Hide" : "Show"
})

// ── build the report inside the iframe ─────────────────────────────────────
let stateAccounts = []
let stateDays = 90

function populateAcctFilter(accounts) {
  const sel = $("acctFilter")
  sel.innerHTML = ""
  const all = document.createElement("option")
  all.value = ""
  all.textContent = "All accounts"
  sel.appendChild(all)
  for (const a of accounts) {
    const opt = document.createElement("option")
    opt.value = a.tradingAccountId
    opt.textContent = a.tradingAccountId + (a.name ? " · " + a.name : "")
    sel.appendChild(opt)
  }
  sel.value = ""
}

async function renderReport(days, acct) {
  statusLine.textContent = "Fetching your trades…"
  const res = await fetch("/api/report?days=" + days + (acct ? "&acct=" + encodeURIComponent(acct) : ""))
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || "report failed")
  const scope = acct ? " · account " + acct : " across " + data.perAccount.length + " account(s)"
  statusLine.textContent = data.trades.length + " closed trades" + scope + " — building report…"
  const tplRes = await fetch("/report-template")
  if (!tplRes.ok) throw new Error("report template missing")
  let tpl = await tplRes.text()
  tpl = tpl.replace("__TRADES__", JSON.stringify(data.trades))
  tpl = tpl.replace(
    "Source files: CLOSED_POSITIONS_1972530, CLOSED_POSITIONS_2013767",
    "Accounts: " + data.perAccount.map((a) => "CLOSED_POSITIONS_" + a.accountId).join(", "),
  )
  frame.srcdoc = tpl
  statusLine.textContent = data.trades.length + " closed trades" + scope + " · fetched from your IP"
}

$("acctFilter").addEventListener("change", () => {
  renderReport(stateDays, $("acctFilter").value).catch((err) => {
    statusLine.textContent = "Report failed: " + err.message
  })
})

function enterReport(email, accounts) {
  loginView.classList.add("hidden")
  reportView.classList.remove("hidden")
  stateAccounts = accounts
  populateAcctFilter(accounts)
  $("whoAmI").textContent = email + " · " + accounts.length + " account(s)"
}

// ── login ──────────────────────────────────────────────────────────────────
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault()
  errorBox.classList.remove("show")
  const btn = $("loginBtn")
  btn.disabled = true
  btn.textContent = "Logging in…"
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value.trim(), password: $("password").value }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || "login failed")
    enterReport(data.email, data.accounts)
    await renderReport(90)
  } catch (err) {
    showError(err.message)
  } finally {
    btn.disabled = false
    btn.textContent = "Log in"
  }
})

// ── logout ─────────────────────────────────────────────────────────────────
$("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" })
  frame.srcdoc = ""
  reportView.classList.add("hidden")
  loginView.classList.remove("hidden")
  $("password").value = ""
})

// ── restore saved session on load ──────────────────────────────────────────
;(async function init() {
  try {
    const res = await fetch("/api/status")
    const data = await res.json()
    if (data.loggedIn) {
      enterReport(data.email, data.accounts)
      await renderReport(90)
      return
    }
  } catch {}
  loginView.classList.remove("hidden")
})()
</script>
</body>
</html>
